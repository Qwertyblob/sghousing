services:
  db:
    # amd64-only image; runs under Rosetta/QEMU on Apple Silicon (see README).
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: sg
      POSTGRES_PASSWORD: sg
      POSTGRES_DB: sg_housing
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP check: the image's init phase runs a socket-only temp server, which a
      # socket check would report healthy before init scripts finish.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sg -d sg_housing"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  pgdata:
